[Account]
username = $USERNAME
password = $(echo -n "$PASSWORD" | sha256sum | awk '{print $1}')

[Server]
wg_conf_path = /etc/wireguard
app_ip = 0.0.0.0
app_port = $APP_PORT
auth_req = true
version = v3.0.8
dashboard_refresh_interval = 10000
dashboard_sort = status

[Peers]
peer_global_dns = 1.1.1.1
peer_endpoint_allowed_ip = 0.0.0.0/0
peer_display_mode = grid
remote_endpoint = 0.0.0.0
peer_mtu = 1280
peer_keep_alive = 25
